# Changelog entry - every PR into dev brings its own changelog entry, a file in
# changelog/unreleased/ (its README shows the format), so the release notes are
# written and reviewed with each change instead of drafted from the commit log
# at release time. `yarn changelog:collect` turns the waiting entries into one
# release.
#
# A PR that nobody using the app will notice (tests, CI, refactors, docs, or a
# fix to something not yet released) takes the `no-changelog` label instead.
# Adding or removing the label re-runs the check. Every entry file is validated
# either way, so a broken one is caught before the release.
#
# It needs only node and git (no install). The rules live in
# scripts/changelog.mjs (--check, --require-entry).

name: Changelog entry

on:
  pull_request:
    branches: [dev]
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [dev]
    paths: [changelog/unreleased/**]

concurrency:
  group: changelog-entry-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  entry:
    name: Changelog entry
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # The whole history, so the diff can find where the branch left dev.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check the entry
        env:
          IS_PR: ${{ github.event_name == 'pull_request' }}
          NO_CHANGELOG: ${{ contains(github.event.pull_request.labels.*.name, 'no-changelog') }}
          BASE: origin/${{ github.base_ref }}
        run: |
          if [ "$IS_PR" != "true" ]; then
            echo "Pushed to dev: validating entries only."
            node scripts/changelog.mjs --check
          elif [ "$NO_CHANGELOG" = "true" ]; then
            echo "Labelled no-changelog: validating existing entries only."
            node scripts/changelog.mjs --check
          else
            node scripts/changelog.mjs --check --require-entry "$BASE"
          fi
